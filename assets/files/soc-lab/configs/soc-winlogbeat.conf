# Logstash pipeline — home lab; API key stored as es_api_key in Logstash keystore
input {
  beats {
    host => "192.168.10.129"
    port => 5044
  }
}

output {
  elasticsearch {
    hosts => ["https://localhost:9200"]
    api_key => "${es_api_key}"
    ssl_certificate_authorities => [
      "/etc/logstash/certs/http_ca.crt"
    ]
    index => "winlogbeat-%{+YYYY.MM.dd}"
    data_stream => false
    ilm_enabled => false
    manage_template => false
  }
}
